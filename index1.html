<style>
/* Layout: one mobile-first ledger app. Top bar, role tabs in a bottom bar, lots as ruled ledger rows with a round grade stamp. */
:root{
  --bg:#f2f6f1; --surface:#ffffff; --ink:#10241a; --muted:#566b5e; --line:#d5e0d7; --line-soft:#e6eee8;
  --accent:#059669; --accent-ink:#ffffff; --accent-text:#047857; --accent-soft:#dcf2e6;
  --warn:#9a5a06; --warn-soft:#fdf0d6; --warn-bar:#f59e0b;
  --bad:#b4231f; --bad-soft:#fde6e3; --bad-bar:#dc2626;
  --shadow:0 1px 0 rgba(16,36,26,.04),0 8px 24px -12px rgba(16,36,26,.18);
  --f-display:'Bricolage Grotesque','Mukta',system-ui,sans-serif;
  --f-body:'Mukta',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1511; --surface:#12201a; --ink:#e5f0e9; --muted:#93a99b; --line:#25392f; --line-soft:#1b2d24;
  --accent:#059669; --accent-text:#34d399; --accent-soft:#0f2f22;
  --warn:#f5b84a; --warn-soft:#33250a; --bad:#ff8a80; --bad-soft:#3a1816;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 28px -12px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1511; --surface:#12201a; --ink:#e5f0e9; --muted:#93a99b; --line:#25392f; --line-soft:#1b2d24;
  --accent:#059669; --accent-text:#34d399; --accent-soft:#0f2f22;
  --warn:#f5b84a; --warn-soft:#33250a; --bad:#ff8a80; --bad-soft:#3a1816;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 28px -12px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}

/* top bar */

.brand{display:flex;align-items:baseline;gap:10px;min-width:0}

.pill.warn{background:var(--warn-soft);color:var(--warn)}

.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}

/* buttons and fields */
.btn{appearance:none;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:10px 18px;font-weight:700;font-size:16px;cursor:pointer;min-height:44px}

.btn.block{width:100%}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}

/* login */

.hero h1{font-size:clamp(30px,5.2vw,46px);line-height:1.04;font-weight:800;margin:10px 0 12px}
.hero p{max-width:46ch;color:var(--muted);margin:0 0 20px}
.flow{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}

.flow li b{font-weight:700}

/* ledger rows */
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:6px 0 14px}

.lot{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:6px 14px;padding:16px;border-top:1px solid var(--line-soft);align-items:start}

.lot .main{min-width:0}

.lot .side{text-align:right;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.lot .wide{grid-column:2 / -1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.price{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--accent-text);line-height:1}
.band{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.stamp{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:22px;border:2.5px solid var(--accent);color:var(--accent-text);background:var(--accent-soft)}
.stamp.A{background:var(--accent);color:var(--accent-ink)}
.stamp.C{border-color:var(--warn-bar);color:var(--warn);background:var(--warn-soft)}
.stamp.D{border-color:var(--bad-bar);color:var(--bad);background:var(--bad-soft)}
.stamp.none{border-style:dashed;border-color:var(--muted);color:var(--muted);background:transparent;font-size:18px}
.lock{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--warn)}
.empty{padding:34px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:19px;margin-bottom:4px}

/* weather chips */
.wx{display:inline-flex;align-items:center;gap:7px;border-radius:8px;padding:4px 10px;font-size:13.5px;font-weight:600}
.wx i{width:9px;height:9px;border-radius:50%;background:currentColor}
.wx.ok{background:var(--accent-soft);color:var(--accent-text)}
.wx.high{background:var(--bad-bar);color:#fff}
.wx.med{background:var(--warn-bar);color:#2b1a00}

/* filters */
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:14px}

/* notifications */
.note{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface);display:flex;flex-direction:column;gap:4px}
.note .ch{font-size:12px;font-weight:700;color:var(--accent-text);letter-spacing:.05em;text-transform:uppercase}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:20}
.nav .in{max-width:980px;margin:0 auto;display:flex;gap:6px}
.nav button{flex:1;min-height:46px;border:0;background:transparent;border-radius:10px;font-weight:600;color:var(--muted);cursor:pointer;font-size:15.5px;padding:6px 8px}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent-text)}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(5,20,12,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:20px max(18px,env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px));border:1px solid var(--line)}
@media (min-width:640px){.scrim{align-items:center}.sheet{border-radius:18px}}
.sheet h2{font-size:23px;font-weight:800}
.result{border-radius:12px;padding:14px;margin-top:4px;display:flex;flex-direction:column;gap:8px}
.result.Accept{background:var(--accent-soft)}
.result.Counter{background:var(--warn-soft)}
.result.Reject{background:var(--bad-soft)}
.result .lead{font-weight:700;font-size:17px}
.inv{display:grid;grid-template-columns:1fr auto;gap:4px 14px;font-size:15px}
.inv dt{color:var(--muted)}.inv dd{margin:0;text-align:right;font-family:var(--f-mono)}
.inv .tot{font-weight:700;color:var(--ink)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;z-index:60;max-width:min(92vw,520px);font-weight:500;box-shadow:var(--shadow)}
details.sess{font-size:13px;color:var(--muted)}
details.sess pre{margin:6px 0 0;font-family:var(--f-mono);font-size:12px;background:var(--line-soft);padding:8px;border-radius:8px;overflow-x:auto;max-width:78vw}
.foot{margin-top:22px;font-size:13px;color:var(--muted)}

@media (max-width:720px){
  .login{grid-template-columns:minmax(0,1fr)}
  .lot{grid-template-columns:46px minmax(0,1fr)}
  .lot .side{grid-column:2;flex-direction:row;align-items:baseline;justify-content:space-between;text-align:left;flex-wrap:wrap}
}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .2s ease-out}@keyframes up{from{transform:translateY(14px);opacity:.4}}}

/* payments and JSON */
pre.json{margin:0;font-family:var(--f-mono);font-size:12.5px;background:var(--line-soft);border-radius:9px;padding:10px 12px;overflow-x:auto;max-width:100%;white-space:pre}
.pm{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;background:var(--surface)}
.pm:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.pm input{margin-top:4px;accent-color:var(--accent)}
details.js{font-size:13.5px}details.js>summary{cursor:pointer;font-weight:600;color:var(--accent-text)}details.js pre{margin-top:8px}
</style>

<div class="wrap" id="app"></div>

<script>
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const PHONE_RE=/^[6-9]\d{9}$/;
const TODAY='2026-10-25';

const LOCS={Pune:[18.5204,73.8567],Nashik:[19.9975,73.7898],Satara:[17.6805,74.0183],Ahilyanagar:[19.0948,74.7480],Solapur:[17.6599,75.9064],Kolhapur:[16.705,74.2433],Latur:[18.4088,76.5604]};
const CROPS={
  'Wheat':{base:2425,vars:['Lokwan','Sharbati','HD-2189']},
  'Soybean':{base:4892,vars:['JS-335','MAUS-71']},
  'Maize':{base:2225,vars:['Hybrid yellow','Local']},
  'Onion':{base:1800,vars:['Red Nashik','Light red']},
  'Tur (Arhar)':{base:7550,vars:['BDN-711','Local']},
  'Gram':{base:5650,vars:['Vijay','Digvijay']}
};
const GF={A:1.08,B:1.0,C:0.92,D:0.82};
const SCOPES={Farmer:['lot:create','lot:read:own'],Expert:['lot:audit','lot:read:pending'],Trader:['market:read','bid:create','payment:write','escrow:hold']};
const REG={
  '9876543210':{name:'Ramesh Patil',role:'Farmer',base:'Nashik'},
  '7020304050':{name:'Sunita Jadhav',role:'Farmer',base:'Satara'},
  '9123456780':{name:'Dr. Anita Kulkarni',role:'Expert',base:'Pune'},
  '8012345678':{name:'Shaikh Agro Traders',role:'Trader',base:'Pune'}
};

function price(crop,grade,fallback){
  const b=CROPS[crop].base*GF[grade]*(fallback?0.97:1), r=x=>Math.round(x/10)*10;
  const floor=r(b*0.95), ceiling=r(b*1.07);
  return {floor,ceiling,mid:(floor+ceiling)/2,source:fallback?'estimated_seasonal_baseline':'agmarknet_live'};
}
function gradeOf(m,f){ if(m<=12&&f<=1)return 'A'; if(m<=15&&f<=2.5)return 'B'; if(m<=18)return 'C'; return 'D'; }
function broker(bid,p){
  const th=p.mid-p.mid*0.04;
  if(bid<p.floor) return {d:'Reject',counter:p.floor};
  if(bid>=th) return {d:'Accept'};
  return {d:'Counter',counter:Math.max((bid+p.mid)/2,p.floor)};
}
function brokerJson(x){
  if(x.d==='Reject') return {status:'Reject',counter_offer:x.counter,instruction:'Bid above the system entry line.'};
  if(x.d==='Accept') return {status:'Accept',deposit_required_10pct:true};
  return {status:'Counter',counter_offer:x.counter};
}
function hav(a,b){
  const R=6371,t=x=>x*Math.PI/180,dLa=t(b[0]-a[0]),dLo=t(b[1]-a[1]);
  const h=Math.sin(dLa/2)**2+Math.cos(t(a[0]))*Math.cos(t(b[0]))*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function fleet(q){ return q<30?'Mini-truck':q<=100?'Tractor':'Multi-axle commercial line'; }
function route(lot,base,qty){
  const km=hav(lot.coords,LOCS[base]), road=Math.round(km*1.2), n=lot.num, alerts=[];
  if(n%3===0) alerts.push({t:'Heavy rain',seg:`km ${Math.round(road*.35)}–${Math.round(road*.6)}`,sev:'high'});
  if(n%4===1) alerts.push({t:'Road blockage',seg:`km ${Math.round(road*.8)}`,sev:'med'});
  return {straight:Math.round(km),road,fleet:fleet(qty||lot.qty),alerts};
}
function wxHtml(r){
  if(!r.alerts.length) return `<span class="wx ok"><i></i>Route clear</span>`;
  return r.alerts.map(a=>`<span class="wx ${a.sev}"><i></i>${esc(a.t)} · ${esc(a.seg)}</span>`).join('');
}

let nextNum=1008, nextDeal=501;
const S={
  step:'phone',phone:'',otp:null,err:'',pendingPhone:'',user:null,tab:'',outage:false,
  filters:{crop:'All',grade:'All',minQty:'',radius:200},modal:null,
  deals:[],notes:{},
  payId:'pm1',addType:'UPI',
  pms:[
    {id:'pm1',type:'UPI',vpa:'shaikhagro@okaxis'},
    {id:'pm2',type:'B2B_CREDIT_LINE',limit_inr:500000,available_inr:500000,ledger:[]},
    {id:'pm3',type:'ENAM_LEDGER',apmc_pool_id:'APMC-PUNE-0147'}
  ],
  lots:[
    {num:1001,owner:'7020304050',farmer:'Sunita Jadhav',crop:'Soybean',variety:'JS-335',qty:60,harvest:'2026-10-06',loc:'Satara',status:'CERTIFIED',grade:'A',pricing:price('Soybean','A')},
    {num:1002,owner:'9876543210',farmer:'Ramesh Patil',crop:'Maize',variety:'Hybrid yellow',qty:150,harvest:'2026-10-09',loc:'Ahilyanagar',status:'CERTIFIED',grade:'B',pricing:price('Maize','B')},
    {num:1003,owner:'9876543210',farmer:'Ramesh Patil',crop:'Onion',variety:'Red Nashik',qty:40,harvest:'2026-10-14',loc:'Nashik',status:'CERTIFIED',grade:'B',pricing:price('Onion','B')},
    {num:1004,owner:'7020304050',farmer:'Sunita Jadhav',crop:'Wheat',variety:'Lokwan',qty:90,harvest:'2026-10-01',loc:'Solapur',status:'CERTIFIED',grade:'A',pricing:price('Wheat','A')},
    {num:1005,owner:'7020304050',farmer:'Sunita Jadhav',crop:'Gram',variety:'Vijay',qty:25,harvest:'2026-10-12',loc:'Satara',status:'CERTIFIED',grade:'C',pricing:price('Gram','C',true)},
    {num:1006,owner:'9876543210',farmer:'Ramesh Patil',crop:'Tur (Arhar)',variety:'BDN-711',qty:35,harvest:'2026-10-18',loc:'Nashik',status:'STATUS_PENDING_MANDIMITRA_EVALUATION'},
    {num:1007,owner:'7020304050',farmer:'Sunita Jadhav',crop:'Soybean',variety:'MAUS-71',qty:70,harvest:'2026-10-20',loc:'Kolhapur',status:'STATUS_PENDING_MANDIMITRA_EVALUATION'}
  ].map(l=>({...l,id:'L-'+l.num,coords:LOCS[l.loc]}))
};
const lotById=id=>S.lots.find(l=>l.id===id);

/* ---------- helpers ---------- */
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,5200);}
function stampHtml(l){return l.grade?`<div class="stamp ${l.grade}" title="Grade ${l.grade}">${l.grade}</div>`:`<div class="stamp none" title="Awaiting audit">?</div>`;}
function srcPill(p){return p.source==='estimated_seasonal_baseline'?`<span class="pill warn" title="Live market feed unavailable">Estimated seasonal baseline</span>`:'';}
function bandHtml(p){return `<div class="band">${inr(p.floor)} – ${inr(p.ceiling)} per qtl</div>`;}
function empty(t,s){return `<div class="empty"><b>${t}</b>${s}</div>`;}
function opts(arr,sel){return arr.map(v=>`<option${v===sel?' selected':''}>${esc(v)}</option>`).join('');}
function claims(u){
  return JSON.stringify({sub:u.mobile,name:u.name,role:u.role,scopes:SCOPES[u.role],exp:'now+3600s',alg:'demo (unsigned)'},null,1);
}

const jsonBox=o=>`<pre class="json">${esc(JSON.stringify(o,null,2))}</pre>`;
async function hmac(msg){
  try{
    const e=new TextEncoder(), k=await crypto.subtle.importKey('raw',e.encode('mandi-mitra-demo-key'),{name:'HMAC',hash:'SHA-256'},false,['sign']);
    return [...new Uint8Array(await crypto.subtle.sign('HMAC',k,e.encode(msg)))].map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(err){ return 'unavailable-in-this-browser'; }
}
function payLabel(m){return m.type==='UPI'?`UPI · ${m.vpa}`:m.type==='B2B_CREDIT_LINE'?`Credit line · ${inr(m.available_inr)} of ${inr(m.limit_inr)} available`:`eNAM ledger · ${m.apmc_pool_id}`;}

/* ---------- login ---------- */
function loginView(){
  const flow=[['01','Farmer lists a lot','It stays hidden from every buyer while it is pending audit.'],
    ['02','Expert grades it','Moisture and foreign matter set grade A to D and a market price band.'],
    ['03','Trader bids','The broker accepts, counters or rejects against the band.'],
    ['04','Truck and weather','Fleet is matched to volume and the route is checked for rain and blockages.'],
    ['05','Escrow','The 10% deposit is held until the route is clear.']];
  let card='';

/* ---------- trader ---------- */
function marketLots(){
  const f=S.filters, base=S.user.base;
  return S.lots.filter(l=>l.status==='CERTIFIED'&&l.qty>0)
    .filter(l=>hav(l.coords,LOCS[base])<=+f.radius)
    .filter(l=>f.crop==='All'||l.crop===f.crop)
    .filter(l=>f.grade==='All'||l.grade===f.grade)
    .filter(l=>!f.minQty||l.qty>=+f.minQty)
    .sort((a,b)=>hav(a.coords,LOCS[base])-hav(b.coords,LOCS[base]));
}

  const f=S.filters, ls=marketLots();
  return `<div class="page-h"><div><h2>Market</h2><div class="muted small">Certified lots within ${f.radius} km of ${esc(S.user.base)}</div></div><span class="pill">${ls.length} lots</span></div>

/* ---------- render ---------- */
function render(){
  const app=$('#app'); let html;
  if(!S.user) html=loginView();
  else{
    const t=S.tab, r=S.user.role;
    const body=r==='Farmer'?(t==='add'?farmerAdd():t==='deliv'?farmerDeliv():farmerLots())
      :r==='Expert'?(t==='done'?expertDone():expertQueue())
      :(t==='deals'?traderDeals():t==='pay'?traderPay():traderMarket());
    html=shell(body);
  }
  app.innerHTML=html;
  const layer=$('#layer');
  layer.innerHTML=S.modal?(S.modal.type==='audit'?auditSheet(lotById(S.modal.id)):bidSheet()):'';
  updateTimers();
}
function updateTimers(){
  if(S.step==='otp'&&S.otp&&!S.user){
    const ttl=$('#ttl'), btn=$('#resendBtn'), now=Date.now();
    if(ttl){const s=Math.max(0,Math.ceil((S.otp.expires-now)/1000));ttl.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
    if(btn){const w=Math.ceil((S.otp.resendAt-now)/1000);btn.disabled=w>0;btn.textContent=w>0?`Resend code in ${w}s`:'Resend code';}
  }
}
setInterval(updateTimers,1000);

/* ---------- actions ---------- */
function newCode(phone){
  S.otp={code:'1234',expires:Date.now()+300000,resendAt:Date.now()+30000,attempts:0};
  S.pendingPhone=phone;
}
function login(mobile,p){
  S.user={mobile,...p}; S.tab=TABS[p.role][0][0]; S.step='phone'; S.err=''; S.otp=null; S.modal=null;
  render(); window.scrollTo(0,0);
}
function nowTime(){return new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});}

document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-act]'); if(!t) return;
  const a=t.dataset.act, v=t.dataset.v;
  if(a==='close'){ if(t.classList.contains('scrim')&&e.target!==t) return; S.modal=null; render(); return; }
  if(a==='demo'){ S.phone=v; S.err=''; render(); return; }
  if(a==='back'){ S.step='phone'; S.err=''; render(); return; }
  if(a==='resend'){
    if(Date.now()<S.otp.resendAt){toast('429 Too Many Requests. Wait for the 30 second timer.');return;}
    newCode(S.pendingPhone); S.err=''; render(); toast('A new code was issued. The previous code no longer works.'); return;
  }
  if(a==='logout'){ S.user=null; S.step='phone'; S.phone=''; S.modal=null; render(); return; }
  if(a==='tab'){ S.tab=v; S.modal=null; render(); window.scrollTo(0,0); return; }
  if(a==='audit'){ S.modal={type:'audit',id:v}; render(); return; }
  if(a==='bid'){ S.modal={type:'bid',id:v,bid:'',qty:'',res:null}; render(); return; }
  if(a==='quick'){ const i=$('#bb'); if(i){i.value=v; i.focus();} return; }
  if(a==='rebid'){ S.modal.res=null; render(); return; }
  if(a==='useCounter'){ S.modal.bid=+v; S.modal.res=null; render(); return; }
  if(a==='refresh'){ const d=S.deals.find(x=>x.id===v); d.alerts.shift(); render();
    toast(d.alerts.length?`${d.alerts.length} route alert still active on ${d.id}. Release stays locked.`:`Route for ${d.id} is clear. Funds can now be released.`); return; }
  if(a==='release'){ const d=S.deals.find(x=>x.id===v);
    if(d.alerts.length){ toast('423 Escrow locked. Route alerts must clear first.'); return; }
    d.escrow.status='FUNDS_RELEASED'; d.escrow.released_at=nowTime(); render();
    toast(`Funds of ${inr(d.escrow.amount_inr)} released for ${d.id}. The route is clear.`); return; }
  if(a==='hold'){
    const m=S.modal, l=lotById(m.id), pm=S.pms.find(x=>x.id===S.payId), qty=m.qty, price=m.bid, total=price*qty, dep=Math.round(total*0.1), ref=Math.random().toString(16).slice(2,14);
    if(broker(price,l.pricing).d!=='Accept'){ toast('That bid is no longer accepted.'); return; }
    const hold={status:'DEPOSIT_HELD_IN_ESCROW',method:pm.type,amount_inr:dep,hold_ref:ref};
    if(pm.type==='UPI') hold.upi_signature=await hmac(JSON.stringify({vpa:pm.vpa,amount_inr:dep,ref}));
    else if(pm.type==='B2B_CREDIT_LINE'){
      if(pm.available_inr<dep){ toast(`Deposit of ${inr(dep)} is above your ${inr(pm.available_inr)} available credit. Pick another method.`); return; }
      pm.available_inr-=dep; pm.ledger.push({kind:'DEBIT',amount_inr:dep,ref});
    }else hold.enam_sync_ref=`ENAM-${pm.apmc_pool_id}-${ref}`;
    const rt=route(l,S.user.base,qty);
    const d={id:'D-'+(nextDeal++),lotId:l.id,qty,price,total,deposit:dep,escrow:hold,fleet:rt.fleet,road:rt.road,alerts:rt.alerts.map(x=>({...x})),buyer:S.user.name,buyerMobile:S.user.mobile,buyerBase:S.user.base};
    l.qty-=qty; if(l.qty<=0) l.status='SOLD';
    S.deals.unshift(d); S.modal=null; S.tab='deals'; render();
    toast(`Deposit of ${inr(dep)} is held in escrow via ${pm.type}. Funds stay locked until the route clears.`); return;
  }
});

document.addEventListener('submit',e=>{
  const f=e.target.closest('[data-form]'); if(!f) return; e.preventDefault();
  const k=f.dataset.form;
  if(k==='phone'){
    const ph=$('#ph').value.trim(); S.phone=ph;
    if(!PHONE_RE.test(ph)){ S.err='422 Unprocessable Entity. Enter 10 digits starting with 6, 7, 8 or 9.'; render(); $('#ph').focus(); return; }
    if(S.otp&&S.pendingPhone===ph&&Date.now()<S.otp.resendAt){ S.step='otp'; S.err=''; render(); toast('429 Too Many Requests. Use the code already sent.'); return; }
    newCode(ph); S.step='otp'; S.err=''; render(); return;
  }
  if(k==='otp'){
    const c=$('#otp').value.trim(), o=S.otp;
    if(!o||Date.now()>o.expires){ S.err='401 Code expired. Go back and request a new one.'; render(); return; }
    if(c!==o.code){
      o.attempts++;
      if(o.attempts>=5){ S.otp=null; S.step='phone'; S.err='Too many wrong codes. Request a new code.'; render(); return; }
      S.err=`401 That code is wrong. ${5-o.attempts} tries left.`; render(); $('#otp').focus(); return;
    }
    const p=REG[S.pendingPhone];
    if(p) login(S.pendingPhone,p); else { S.step='onboard'; S.err=''; render(); }
    return;
  }
  if(k==='onboard'){
    const n=$('#fn').value.trim();
    if(n.length<2){ S.err='Enter your full name.'; render(); return; }
    const p={name:n,role:$('#rl').value,base:$('#bl').value}; REG[S.pendingPhone]=p; login(S.pendingPhone,p); return;
  }
  if(k==='addlot'){
    const q=+$('#qt').value, hd=$('#hd').value;
    if(!(q>0)){ $('#addErr').textContent='Enter a quantity above zero.'; return; }
    if(!hd||hd>TODAY){ $('#addErr').textContent='Harvest date cannot be in the future.'; return; }
    const num=nextNum++, loc=$('#lc').value;
    const l={num,id:'L-'+num,owner:S.user.mobile,farmer:S.user.name,crop:$('#cr').value,variety:$('#vr').value,qty:q,harvest:hd,loc,coords:LOCS[loc],status:'STATUS_PENDING_MANDIMITRA_EVALUATION'};
    S.lots.unshift(l); S.tab='lots'; render();
    toast(`Lot ${l.id} is pending audit and hidden from the marketplace until an expert grades it.`); return;
  }
  if(k==='audit'){
    const l=lotById(f.dataset.id), g=id=>parseFloat($('#'+id).value);
    const mo=g('mo'), fm=g('fm'), gs=g('gs'), pd=g('pd');
    if([mo,fm,gs,pd].some(x=>isNaN(x)||x<0)){ $('#auErr').textContent='Fill every measurement with a number of zero or more.'; return; }
    if(mo>100||fm>100||pd>100){ $('#auErr').textContent='Percentages cannot be above 100.'; return; }
    const grade=gradeOf(mo,fm), p=price(l.crop,grade,S.outage);
    Object.assign(l,{status:'CERTIFIED',grade,pricing:p,audit:{moisture:mo,foreign:fm,grain:gs,color:$('#vc').value,pest:pd}});
    (S.notes[l.owner]=S.notes[l.owner]||[]).unshift({ch:'WhatsApp + SMS',time:nowTime(),
      hi:`मंडी मित्र: आपका लॉट ${l.id} (${l.crop}) ग्रेड ${grade} प्रमाणित हुआ। मध्य भाव ${inr(p.mid)} प्रति क्विंटल।`,
      en:`Your lot ${l.id} (${l.crop}) is certified Grade ${grade}. Mid-market price ${inr(p.mid)} per quintal.`});
    S.modal=null; S.tab='done'; render();
    toast(`Lot ${l.id} certified Grade ${grade} at a ${inr(p.mid)} midpoint. ${l.farmer} was notified on WhatsApp and SMS.${S.outage?' Price is an estimated seasonal baseline.':''}`); return;
  }
  if(k==='addpm'){
    const v=$('#pv').value.trim(), t=S.addType, id='pm'+(S.pms.length+1);
    if(t==='UPI'){ if(!/^[\w.\-]{2,}@[a-z]{2,}$/i.test(v)){ $('#pmErr').textContent='Enter a UPI ID like name@bank.'; return; } S.pms.push({id,type:t,vpa:v}); }
    else if(t==='B2B_CREDIT_LINE'){ const n=+v; if(!(n>=1000)){ $('#pmErr').textContent='Enter a limit of ₹1,000 or more.'; return; } S.pms.push({id,type:t,limit_inr:n,available_inr:n,ledger:[]}); }
    else{ if(!/^APMC-[A-Z]+-\d{4}$/.test(v)){ $('#pmErr').textContent='Use the format APMC-PUNE-0147.'; return; } S.pms.push({id,type:t,apmc_pool_id:v}); }
    render(); toast(`${t} saved and verified in the demo store.`); return;
  }
  if(k==='bid'){
    const qty=+$('#bq').value, bid=+$('#bb').value, l=lotById(S.modal.id);
    if(!(qty>=1&&qty<=l.qty)){ $('#bidErr').textContent=`Quantity must be between 1 and ${l.qty} quintals.`; return; }
    if(!(bid>0)){ $('#bidErr').textContent='Enter a bid per quintal.'; return; }
    S.modal.qty=qty; S.modal.bid=bid; S.modal.res=broker(bid,l.pricing); render();
    const r=$('.result'); if(r) r.scrollIntoView({block:'nearest'}); return;
  }
});

document.addEventListener('change',e=>{
  const t=e.target;
  if(t.matches('[data-filter]')){ S.filters[t.dataset.filter]=t.value; render(); const n=$('#'+t.id); if(n)n.focus(); return; }
  if(t.matches('[data-pay]')){ S.payId=t.value; return; }
  if(t.matches('[data-addtype]')){ S.addType=t.value; render(); const n=$('#pt'); if(n)n.focus(); return; }
  if(t.id==='outage'){ S.outage=t.checked; toast(S.outage?'Market feed outage on. New prices use the seasonal baseline.':'Market feed restored.'); return; }
  if(t.id==='cr'){ $('#vr').innerHTML=opts(CROPS[t.value].vars); return; }
  if(t.id==='lc'){ const c=LOCS[t.value]; $('#co').textContent=c[0].toFixed(4)+', '+c[1].toFixed(4); return; }
});
document.addEventListener('input',e=>{
  if(e.target.id==='fr'){ $('#rv').textContent=e.target.value; return; }
  if(!e.target.closest('#auditForm')) return;
  const mo=parseFloat($('#mo').value), fm=parseFloat($('#fm').value), box=$('#gradePrev');
  if(isNaN(mo)||isNaN(fm)){ box.textContent='Enter moisture and foreign matter to see the grade.'; return; }
  const g=gradeOf(mo,fm), l=lotById($('#auditForm').dataset.id), p=price(l.crop,g,S.outage);
  box.innerHTML=`Grade <b>${g}</b>. Market band ${inr(p.floor)} – ${inr(p.ceiling)}, midpoint <b>${inr(p.mid)}</b> per quintal.`;
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&S.modal){ S.modal=null; render(); } });

render();
</script>

</body></html>
