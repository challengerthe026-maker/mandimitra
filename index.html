<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KMandi Mitra AI assistant</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%; max-width: 500px; }
        h1 { color: #2e7d32; margin-top: 0; text-align: center; font-size: 24px; }
        p { color: #666; text-align: center; font-size: 14px; margin-bottom: 25px; }
        label { font-weight: bold; color: #333; display: block; margin-bottom: 8px; }
        input[type="text"] { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; background-color: #2e7d32; color: white; border: none; padding: 14px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background-color: #1b5e20; }
        .result-box { margin-top: 25px; padding: 15px; border-left: 4px solid #2e7d32; background: #e8f5e9; border-radius: 4px; display: none; }
        .result-box h3 { margin-top: 0; color: #1b5e20; }
    </style>
</head>
<body>

<div class="container">
    <h1>🌾 Krishi Mandi AI</h1>
    <p>Get real-time AI market analysis, transport estimations, and selling advice.</p>
    
    <form id="mandiForm">
        <label for="crop">Crop Name</label>
        <input type="text" id="crop" placeholder="e.g., Onion, Wheat, Tomato" required>
        
        <label for="location">Your Location</label>
        <input type="text" id="location" placeholder="e.g., Nashik, Pune, Junnar" required>
        
        <button type="submit">Get AI Market Insights</button>
    </form>

    <div class="result-box" id="resultBox">
        <h3>📊 AI Mandi Analysis</h3>
        <p id="resultText" style="text-align: left; color: #333;"></p>
    </div>
</div>

<script>
    document.getElementById('mandiForm').addEventListener('submit', function(e) {
        e.preventDefault();
        // Visual indicator that progress works during demo
        document.getElementById('resultBox').style.display = 'block';
        document.getElementById('resultText').innerText = 'Connecting to backend AI engine... Loading market strategy options.';
    });
</script>

</body>
</html>
